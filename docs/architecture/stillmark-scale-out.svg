="832" y="1011" fill="#596775" font-size="18" font-weight="400">Photo descriptions</text><text x="832" y="1038" fill="#596775" font-size="18" font-weight="400">Optional search-intent parsing</text><rect x="1180" y="945" width="350" height="125" rx="14" fill="#fff" stroke="#d8dee5"/><text x="1202" y="980" fill="#18232f" font-size="22" font-weight="700">Cortex Search</text><text x="1202" y="1011" fill="#596775" font-size="18" font-weight="400">Managed search serving</text><text x="1202" y="1038" fill="#596775" font-size="18" font-weight="400">Explicit index publication</text><text x="70" y="1110" fill="#936520" font-size="15" font-weight="700">SCALE APP INSTANCES</text><text x="70" y="1140" fill="#18232f" font-size="19" font-weight="400">Interactive traffic</text><text x="440" y="1110" fill="#39775c" font-size="15" font-weight="700">SCALE WORKER JOBS</text><text x="440" y="1140" fill="#18232f" font-size="19" font-weight="400">Queue depth &amp; workload</text><text x="810" y="1110" fill="#39775c" font-size="15" font-weight="700">SCALE POOL NODES</text><text x="810" y="1140" fill="#18232f" font-size="19" font-weight="400">Scheduled resource demand</text><text x="1180" y="1110" fill="#6f5497" font-size="15" font-weight="700">BOUND SHARED CAPACITY</text><text x="1180" y="1140" fill="#18232f" font-size="19" font-weight="400">Database · storage · API quotas</text><text x="60" y="1220" fill="#506174" font-size="16" font-weight="700">CAPABILITY NOTES</text><text x="60" y="1251" fill="#596775" font-size="19" font-weight="400">Existing technology stack with scale-out options illustrated; replica counts are not current deployed capacity.</text><text x="60" y="1281" fill="#596775" font-size="19" font-weight="400">Upload processing is shown on a dedicated pool by assumption. App Runtime supports up to 10 instances per service.</text><text x="60" y="1311" fill="#596775" font-size="19" font-weight="400">Pool expansion requires scheduled workers. Database, API limits and workload coordination set practical capacity.</text><text x="60" y="1345" fill="#74808b" font-size="16" font-weight="400">Finite batches can suspend when idle. Search-index refresh remains an explicit, separately provisioned operation.</text></svg>